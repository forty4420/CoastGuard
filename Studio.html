<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Studio Architect</title>
<style>
:root {
    --bg:#121212; --panel:#1e1e1e; --border:#333;
    --accent:#00e5ff; --text:#e0e0e0;
    --vid-bg:rgba(255,100,100,0.22); --vid-bd:#ff6464;
    --ov-bg:rgba(155,89,182,0.22); --ov-bd:#9b59b6;
    --au-bg:rgba(39,174,96,0.18); --au-bd:#27ae60;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Inter,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}

/* ─── VIEWPORT ─── */
#viewport{display:flex;flex:1;border-bottom:2px solid var(--border);overflow:hidden;min-height:0}
#canvas-area{flex:1;background:#000;display:flex;align-items:center;justify-content:center}
#mainCanvas{max-width:95%;max-height:95%;background:#000;box-shadow:0 0 40px rgba(0,0,0,.8);border:1px solid #333}

/* ─── INSPECTOR ─── */
#inspector{width:272px;background:var(--panel);border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;font-size:11px}
#inspector h3{margin:0 0 2px;font-size:13px}
.sec-head{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2a2a2a;padding-bottom:3px;margin:10px 0 5px}
label{font-size:9px;color:#777;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.7px}
.prop{margin-bottom:7px}
select,input[type=range],input[type=number],input[type=text]{width:100%;padding:5px 6px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:3px;font-size:11px}
input[type=range]{padding:0;margin-top:3px;accent-color:var(--accent)}
input[type=color]{width:100%;height:28px;border:none;background:none;cursor:pointer;padding:0}
.range-row{display:flex;gap:5px;align-items:center}
.range-row input{flex:1}
.range-row span{font-size:10px;color:#888;min-width:30px;text-align:right}
button{background:#333;color:#fff;border:1px solid #444;padding:6px 11px;border-radius:4px;cursor:pointer;font-weight:600;font-size:11px}
button.primary{background:var(--accent);color:#000;border:none}
button:hover{opacity:.85}
#delete-btn{display:none;width:100%;background:#c0392b;color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer;font-weight:600;font-size:11px;text-align:center}
#delete-btn:hover{background:#e74c3c}

/* ─── TIMELINE ─── */
#timeline{height:300px;background:#181818;display:flex;flex-direction:column}
.toolbar{padding:7px 14px;display:flex;gap:7px;background:#252526;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.toolbar-left{display:flex;gap:7px;align-items:center}
.toolbar-right{display:flex;gap:7px;margin-left:auto;align-items:center}
.time-display{font-family:Consolas,monospace;font-size:12px;color:var(--accent);margin-left:4px}
select.tb-select{padding:4px 6px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:3px;font-size:10px}

#track-container{flex:1;overflow-x:auto;overflow-y:auto;position:relative;background:#181818;cursor:crosshair;padding-top:20px}
#time-markers{position:absolute;top:0;left:0;height:20px;width:10000px;pointer-events:none;border-bottom:1px solid #3a3a3a;z-index:10}

.track{height:58px;background:rgba(255,255,255,.015);position:relative;min-width:10000px;border-top:1px solid #252525}
.track-label{position:sticky;left:0;top:0;z-index:50;color:#000;font-size:9px;font-weight:900;padding:2px 6px;border-radius:0 0 4px 0;display:inline-block}
.track-label.v-lbl{background:var(--accent)}
.track-label.ov-lbl{background:#9b59b6}
.track-label.au-lbl{background:#27ae60}

/* ─── CLIPS ─── */
.clip{position:absolute;top:7px;height:44px;background:rgba(0,229,255,.15);border:1px solid var(--accent);border-radius:3px;cursor:grab;overflow:hidden;z-index:20}
.clip.selected{border:2px solid #fff;z-index:25}
.clip.is-video{background:var(--vid-bg);border-color:var(--vid-bd)}
.clip.is-overlay{background:var(--ov-bg);border-color:var(--ov-bd)}
.clip.is-audio{background:var(--au-bg);border-color:var(--au-bd);cursor:default;top:7px}
.clip-thumb{position:absolute;inset:0;object-fit:cover;opacity:.35;pointer-events:none}
.clip-label{position:absolute;left:4px;top:2px;z-index:1;font-size:9px;color:#fff;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 8px)}
.handle{position:absolute;top:0;bottom:0;width:6px;background:rgba(255,255,255,.35);cursor:ew-resize;z-index:30}
.handle:hover{background:rgba(255,255,255,.6)}
.handle.left{left:0;border-radius:3px 0 0 3px}
.handle.right{right:0;border-radius:0 3px 3px 0}

/* audio waveform canvas inside audio clip */
.audio-canvas{pointer-events:none;display:block}

/* ─── PLAYHEAD ─── */
#playhead{position:absolute;top:0;left:0;width:12px;height:100%;z-index:100;cursor:ew-resize;transform:translateX(-6px)}
#playhead::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:1px;height:100%;background:#ff3d00;box-shadow
