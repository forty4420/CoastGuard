                                {/* Additional Instructions */}
                                <div className="p-6 rounded-2xl bg-zinc-900/50 border border-zinc-800">
                                    <label className="block text-sm font-medium text-zinc-300 mb-2">
                                        Additional Instructions (Optional)
                                    </label>
                                    <textarea
                                        value={config.additionalInstructions}
                                        onChange={(e) => setConfig({ ...config, additionalInstructions: e.target.value })}
                                        placeholder="Any specific requirements, style notes, topics to avoid, etc..."
                                        rows={3}
                                        className="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white placeholder-zinc-500 input-focus resize-none"
                                    />
                                </div>

                                {/* No Profile Selected Notice */}
                                {!selectedProfile && (
                                    <div className="p-6 rounded-2xl bg-amber-500/10 border border-amber-500/30">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">📺</span>
                                                <div>
                                                    <h3 className="text-lg font-semibold text-amber-300">No Profile Selected</h3>
                                                    <p className="text-sm text-amber-400/70">Create a channel profile to generate scripts</p>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => setActiveTab('profiles')}
                                                className="px-4 py-2 rounded-lg bg-amber-500 text-black font-medium hover:bg-amber-400 transition-colors"
                                            >
                                                Create Profile
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Generate Button */}
                                <button
                                    onClick={handleGenerate}
                                    disabled={!config.topic.trim() || !selectedProfile}
                                    className="w-full py-4 rounded-xl font-bold text-lg btn-primary disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3"
                                >
                                    <span>⚡</span>
                                    {!selectedProfile ? 'SELECT A PROFILE FIRST' : 'GENERATE SCRIPT PROMPT'}
                                </button>

                                {/* Generated Output */}
                                {generatedPrompt && (
                                    <div className="p-6 rounded-2xl bg-zinc-900/50 border border-zinc-800 animate-fade-in">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-lg font-semibold text-white">Generated Prompt</h3>
                                                {settings.compactMode && (
                                                    <span className="px-2 py-1 text-xs bg-green-500/20 text-green-400 rounded">Compact Mode</span>
                                                )}
                                            </div>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={handleDownload}
                                                    className="px-4 py-2 rounded-lg btn-secondary text-sm font-medium flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Download
                                                </button>
                                                <button
                                                    onClick={() => handleCopy()}
                                                    className={`px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all ${
                                                        copied ? 'bg-green-500 text-white' : 'btn-primary'
                                                    }`}
                                                >
                                                    {copied ? 'Copied!' : 'Copy'}
                                                </button>
                                            </div>
                                        </div>

                                        <div className="p-4 rounded-xl bg-zinc-950 border border-zinc-800 max-h-[300px] overflow-auto custom-scrollbar">
                                            <pre className="whitespace-pre-wrap text-sm text-zinc-300 mono">{generatedPrompt}</pre>
                                        </div>

                                        {/* AI Generation Button */}
                                        <div className="mt-4">
                                            <button
                                                onClick={handleGenerateScript}
                                                disabled={isGenerating || !settings.apiKey}
                                                className={`w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 transition-all ${
                                                    isGenerating
                                                        ? 'bg-purple-600 text-white animate-pulse'
                                                        : !settings.apiKey
                                                            ? 'bg-zinc-700 text-zinc-400 cursor-not-allowed'
                                                            : 'bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-500 hover:to-pink-500'
                                                }`}
                                            >
                                                {isGenerating ? (
                                                    <><span className="animate-spin">⏳</span> Generating Script...</>
                                                ) : !settings.apiKey ? (
                                                    <><span>🔑</span> Add API Key in Settings</>
                                                ) : (
                                                    <><span>🚀</span> Generate Full Script with AI</>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* AI Generated Script Output */}
                                {(streamingText || generatedScript) && (
                                    <div className="p-6 rounded-2xl bg-gradient-to-br from-purple-900/20 to-pink-900/20 border border-purple-500/30 animate-fade-in">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-lg font-semibold text-white flex items-center gap-2">
                                                <span>📜</span> AI Generated Script
                                                {isGenerating && <span className="text-sm text-purple-400 animate-pulse">streaming...</span>}
                                            </h3>
                                            {generatedScript && (
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => downloadAsFile(generatedScript, `script-${config.topic.slice(0,20).replace(/[^a-z0-9]/gi,'-')}.txt`)}
                                                        className="px-4 py-2 rounded-lg btn-secondary text-sm font-medium"
                                                    >
                                                        Download Script
                                                    </button>
                                                    <button
                                                        onClick={() => handleCopy(generatedScript)}
                                                        className="px-4 py-2 rounded-lg btn-primary text-sm font-medium"
                                                    >
                                                        Copy Script
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        <div
                                            className="p-4 rounded-xl bg-zinc-950 border border-zinc-800 max-h-[600px] overflow-auto custom-scrollbar prose prose-invert prose-sm max-w-none"
                                            dangerouslySetInnerHTML={{ __html: renderMarkdown(streamingText || generatedScript) }}
                                        />

                                        {generatedScript && (
                                            <div className="mt-4 flex items-center justify-between text-sm text-zinc-500">
                                                <span>Word count: ~{generatedScript.split(/\s+/).length} words</span>
                                                <span>Est. reading time: {Math.ceil(generatedScript.split(/\s+/).length / 150)} min</span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Profiles Tab */}
                        {activeTab === 'profiles' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">Channel Profiles</h2>
                                        <p className="text-zinc-400">Save your channel settings for quick access</p>
                                    </div>
                                    <button
                                        onClick={() => setShowNewProfile(!showNewProfile)}
                                        className="px-4 py-2 rounded-lg btn-primary font-medium"
                                    >
                                        {showNewProfile ? 'Cancel' : '+ New Profile'}
                                    </button>
                                </div>

                                {/* New Profile Form */}
                                {showNewProfile && (
                                    <div className="p-6 rounded-2xl bg-zinc-900/50 border border-indigo-500/50 animate-fade-in">
                                        <h3 className="text-lg font-semibold text-white mb-4">Create New Profile</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-zinc-400 mb-2">Channel Name *</label>
                                                <input
                                                    type="text"
                                                    value={profileForm.name}
                                                    onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus"
                                                    placeholder="e.g., History Uncovered"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-zinc-400 mb-2">Genre</label>
                                                <select
                                                    value={profileForm.genre}
                                                    onChange={(e) => setProfileForm({ ...profileForm, genre: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus"
                                                >
                                                    {CONTENT_GENRES.map(g => <option key={g}>{g}</option>)}
                                                </select>
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-medium text-zinc-400 mb-2">Tone & Voice *</label>
                                                <textarea
                                                    value={profileForm.tone}
                                                    onChange={(e) => setProfileForm({ ...profileForm, tone: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus resize-none"
                                                    rows={2}
                                                    placeholder="e.g., Authoritative yet accessible, with dry British humor. Think David Attenborough meets a history professor."
                                                />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-medium text-zinc-400 mb-2">Call to Action *</label>
                                                <input
                                                    type="text"
                                                    value={profileForm.cta}
                                                    onChange={(e) => setProfileForm({ ...profileForm, cta: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus"
                                                    placeholder="e.g., Subscribe for more hidden history, and let me know in the comments..."
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-zinc-400 mb-2">Content Type</label>
                                                <select
                                                    value={profileForm.verifiability}
                                                    onChange={(e) => setProfileForm({ ...profileForm, verifiability: e.target.value })}
                                                    className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus"
                                                >
                                                    <option>Factual/Historical</option>
                                                    <option>Fictional/Creative</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button
                                            onClick={handleSaveProfile}
                                            disabled={!profileForm.name || !profileForm.tone || !profileForm.cta}
                                            className="mt-4 px-6 py-3 rounded-lg bg-green-500 text-white font-medium hover:bg-green-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            Save Profile
                                        </button>
                                    </div>
                                )}

                                {/* Profile Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {profiles.map(profile => (
                                        <ProfileCard
                                            key={profile.id}
                                            profile={profile}
                                            isSelected={selectedProfile?.id === profile.id}
                                            onSelect={() => {
                                                setSelectedProfile(profile);
                                                setActiveTab('generate');
                                            }}
                                            onDelete={() => handleDeleteProfile(profile.id)}
                                        />
                                    ))}

                                    {profiles.length === 0 && !showNewProfile && (
                                        <div className="col-span-full text-center py-12">
                                            <div className="text-4xl mb-4">📺</div>
                                            <h3 className="text-lg font-semibold text-white mb-2">No profiles yet</h3>
                                            <p className="text-zinc-400 mb-4">Create your first channel profile to save your settings</p>
                                            <button
                                                onClick={() => setShowNewProfile(true)}
                                                className="px-6 py-3 rounded-lg btn-primary font-medium"
                                            >
                                                Create First Profile
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* History Tab */}
                        {activeTab === 'history' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">Generation History</h2>
                                        <p className="text-zinc-400">Your recent prompt generations</p>
                                    </div>
                                    {history.length > 0 && (
                                        <button
                                            onClick={handleClearHistory}
                                            className="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 font-medium hover:bg-red-500/30 transition-colors"
                                        >
                                            Clear All
                                        </button>
                                    )}
                                </div>

                                {history.length > 0 ? (
                                    <div className="space-y-3">
                                        {history.map((item) => (
                                            <div
                                                key={item.id}
                                                className="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 flex items-center justify-between"
                                            >
                                                <div className="flex-1">
                                                    <h4 className="font-medium text-white">{item.topic}</h4>
                                                    <div className="flex flex-wrap gap-2 mt-1">
                                                        <span className="badge bg-zinc-700 text-zinc-300">{item.format}</span>
                                                        <span className="badge bg-zinc-700 text-zinc-300">{item.template}</span>
                                                        <span className="text-xs text-zinc-500">{item.profile}</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3 ml-4">
                                                    <span className="text-xs text-zinc-500">
                                                        {new Date(item.timestamp).toLocaleDateString()}
                                                    </span>
                                                    <button
                                                        onClick={() => handleDeleteHistory(item.id)}
                                                        className="p-2 rounded-lg text-zinc-500 hover:text-red-400 hover:bg-red-500/10 transition-colors"
                                                        title="Delete"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-12">
                                        <div className="text-4xl mb-4">📜</div>
                                        <h3 className="text-lg font-semibold text-white mb-2">No history yet</h3>
                                        <p className="text-zinc-400">Generate your first prompt to see it here</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Settings Tab */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in">
                                <div>
                                    <h2 className="text-2xl font-bold text-white">Settings</h2>
                                    <p className="text-zinc-400">Configure AI integration and preferences</p>
                                </div>

                                {/* API Configuration */}
                                <div className="p-6 rounded-2xl bg-zinc-900/50 border border-zinc-800">
                                    <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                                        <span>🔑</span> API Configuration
                                    </h3>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-zinc-400 mb-2">
                                                AI Provider
                                            </label>
                                            <div className="flex gap-4">
                                                <button
                                                    onClick={() => handleSaveSettings({ ...settings, apiProvider: 'openai' })}
                                                    className={`flex-1 p-4 rounded-xl border transition-all ${
                                                        settings.apiProvider === 'openai'
                                                            ? 'bg-green-500/20 border-green-500 text-green-400'
                                                            : 'bg-zinc-800 border-zinc-700 text-zinc-400 hover:border-zinc-600'
                                                    }`}
                                                >
                                                    <div className="font-medium">OpenAI</div>
                                                    <div className="text-xs opacity-70">GPT-4o</div>
                                                </button>
                                                <button
                                                    onClick={() => handleSaveSettings({ ...settings, apiProvider: 'anthropic' })}
                                                    className={`flex-1 p-4 rounded-xl border transition-all ${
                                                        settings.apiProvider === 'anthropic'
                                                            ? 'bg-orange-500/20 border-orange-500 text-orange-400'
                                                            : 'bg-zinc-800 border-zinc-700 text-zinc-400 hover:border-zinc-600'
                                                    }`}
                                                >
                                                    <div className="font-medium">Anthropic</div>
                                                    <div className="text-xs opacity-70">Claude Sonnet</div>
                                                </button>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-zinc-400 mb-2">
                                                API Key
                                            </label>
                                            <input
                                                type="password"
                                                value={settings.apiKey}
                                                onChange={(e) => handleSaveSettings({ ...settings, apiKey: e.target.value })}
                                                placeholder={settings.apiProvider === 'openai' ? 'sk-...' : 'sk-ant-...'}
                                                className="w-full px-4 py-3 rounded-lg bg-zinc-800 border border-zinc-700 text-white input-focus mono"
                                            />
                                            <p className="mt-2 text-xs text-zinc-500">
                                                Your API key is stored locally in your browser. Never shared.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Prompt Settings */}
                                <div className="p-6 rounded-2xl bg-zinc-900/50 border border-zinc-800">
                                    <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                                        <span>⚡</span> Prompt Settings
                                    </h3>

                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between p-4 rounded-xl bg-zinc-800/50 border border-zinc-700">
                                            <div>
                                                <div className="font-medium text-white">Compact Mode</div>
                                                <div className="text-sm text-zinc-400">Use minimal tokens (60-70% fewer) while maintaining quality</div>
                                            </div>
                                            <Toggle
                                                checked={settings.compactMode}
                                                onChange={(checked) => handleSaveSettings({ ...settings, compactMode: checked })}
                                                label=""
                                            />
                                        </div>

                                        <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30">
                                            <div className="flex items-start gap-3">
                                                <span className="text-xl">💡</span>
                                                <div className="text-sm text-indigo-300">
                                                    <strong>Token Usage Tip:</strong> Compact mode generates prompts that are ~60-70% smaller while producing the same quality scripts. Recommended for most use cases.
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* API Status */}
                                <div className="p-4 rounded-xl bg-zinc-800/50 border border-zinc-700 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-3 h-3 rounded-full ${settings.apiKey ? 'bg-green-500' : 'bg-zinc-500'}`} />
                                        <span className="text-sm text-zinc-400">
                                            {settings.apiKey ? `${settings.apiProvider === 'openai' ? 'OpenAI' : 'Anthropic'} API configured` : 'No API key configured'}
                                        </span>
                                    </div>
                                    {settings.apiKey && (
                                        <button
                                            onClick={() => handleSaveSettings({ ...settings, apiKey: '' })}
                                            className="text-sm text-red-400 hover:text-red-300"
                                        >
                                            Clear Key
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-zinc-800 mt-12 py-6">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-zinc-500">
                            Script Forge Pro — AI-Powered YouTube Script Generation
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
